services:
  - type: web
    name: e-rajpatra-platform
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_INITIAL_EMAIL
        value: admin@rajpatra.gov.in
      - key: ADMIN_INITIAL_PASSWORD
        value: Admin@12345
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
